# Production-стек: образы собираются из исходников — и локально, и на сервере.
# Dev-режим с watch и HMR живёт в docker-compose.yml (docker compose up -d --build).
# Этот файл подключается только явным -f docker-compose.prod.yml — файл по
# умолчанию теперь dev, поэтому без -f деплой поднял бы dev-стек.
# Секреты и ключи берутся из .env рядом с этим файлом (см. .env.example).
#
# Наружу этот стек не смотрит: ни один сервис не публикует портов на хост.
# HTTPS и 443 держит отдельный edge-gateway (/srv/edge на сервере), он же
# разводит запросы по SNI между flatnik и VPN-панелью babylon. Связь — через
# внешнюю сеть app-network, в которую входит только gateway.
#
# Имя проекта не задаётся намеренно: префикс контейнеров должен остаться
# flatnik-, на имя flatnik-back-1 опирается docker inspect в deploy.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flatnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flatnik}
      POSTGRES_DB: ${POSTGRES_DB:-flatnik}
    volumes:
      # Данные живут в named volume: docker compose down их не трогает,
      # а вот down -v удалит безвозвратно — не запускать на сервере.
      - db-data:/var/lib/postgresql/data
    # Порт наружу намеренно не публикуется. Сценарий «back вне Docker» — это
    # разработка, для неё есть docker-compose.yml; на сервере back ходит в базу
    # по сети compose (POSTGRES_HOST=db), а публикация 127.0.0.1:5432 только
    # роняла деплой, когда порт на хосте уже был кем-то занят.
    # Нужен psql на сервере: docker compose -f docker-compose.prod.yml exec db psql -U flatnik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  back:
    image: flatnik-back:local
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${BACK_PORT:-3000}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-flatnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flatnik}
      POSTGRES_DB: ${POSTGRES_DB:-flatnik}
      JWT_SECRET: ${JWT_SECRET:-flatnik-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      SMSAERO_EMAIL: ${SMSAERO_EMAIL:-}
      SMSAERO_API_KEY: ${SMSAERO_API_KEY:-}
      SMSAERO_SIGN: ${SMSAERO_SIGN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODERATOR_CHAT_ID: ${TELEGRAM_MODERATOR_CHAT_ID:-}
      SEO_INDEX_HTML: /srv/static/index.html
      # /api/docs наружу не отдаём: документация API — не публичная страница
      SWAGGER_UI: ${SWAGGER_UI:-off}
    volumes:
      # Только чтение: бэкенд берёт отсюда шаблон index.html, чтобы подставить
      # в него мету и тексты. Том наполняет сервис front, back в него не пишет.
      #
      # depends_on на front здесь намеренно нет: он одноразовый, и ожидание его
      # успеха связало бы старт API со сборкой фронта. Пока файла нет, страницы
      # отдаёт гейтвей своим фоллбэком.
      - front-dist:/srv/static:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Именно 127.0.0.1: localhost в alpine резолвится и в ::1, а сервер
      # слушает только IPv4 — busybox wget получал бы Connection refused.
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:${BACK_PORT:-3000}/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Одноразовый: выкладывает собранный бандл в volume и завершается.
  # Раздаёт статику gateway, поэтому ни порта, ни рестарта здесь нет.
  front:
    image: flatnik-front:local
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        # Vite инлайнит VITE_* в бандл при сборке — ключи попадают сюда,
        # а не в environment рантайма.
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
        VITE_SMARTCAPTCHA_CLIENT_KEY: ${VITE_SMARTCAPTCHA_CLIENT_KEY:-}
        VITE_YANDEX_METRICA_ID: ${VITE_YANDEX_METRICA_ID:-}
    volumes:
      - front-dist:/srv/static
    restart: "no"

  # Единственная точка входа: и статика, и /api приходят с одного origin,
  # поэтому CORS в этой схеме не участвует вообще.
  # Порт на хост не публикуется — до gateway достучится только edge по app-network.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - front-dist:/srv/static:ro
    networks:
      default:
      # Алиас задан явно: по умолчанию контейнер получил бы в общей сети имя
      # своего сервиса — «gateway», слишком общее для чужого соседства.
      app-network:
        aliases:
          - flatnik-gateway
    environment:
      # Его подставляет envsubst nginx-образа при старте.
      BACK_PORT: ${BACK_PORT:-3000}
    depends_on:
      back:
        condition: service_healthy
      front:
        # Стартуем только когда бандл уже лежит в volume.
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# app-network создаётся вне этого стека (docker network create app-network) и
# живёт дольше него: в ней же сидит edge-gateway и сервисы babylon.
networks:
  default:
  app-network:
    external: true

volumes:
  db-data:
  # Бандл между сборкой (front) и раздачей (gateway).
  front-dist:
