services:
  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Публичный HTTPS-адрес без открытия портов и настройки DNS.
  # URL смотреть в логах: npm run tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://front:80
    depends_on:
      front:
        condition: service_started
    restart: unless-stopped
