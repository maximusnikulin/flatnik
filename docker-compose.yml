# Локально: docker compose up -d --build — образы собираются из исходников.
# На сервере: IMAGE_TAG задан, образы тянутся из GHCR (сборки нет — мало RAM).
services:
  back:
    image: ${BACK_IMAGE:-flatnik-back:local}
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  front:
    image: ${FRONT_IMAGE:-flatnik-front:local}
    build:
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Публичный HTTPS-адрес без открытия портов и настройки DNS.
  # URL смотреть в логах: docker compose logs cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://front:80
    depends_on:
      front:
        condition: service_started
    restart: unless-stopped
