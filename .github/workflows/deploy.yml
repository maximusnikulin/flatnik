name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /srv/flatnik
  GH_HOST: github.com
  REPO_PATH: maximusnikulin/flatnik.git

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      # Первый запуск: создаём deploy-ключ и доверяем хосту github.com.
      # Публичный ключ печатается в лог — его нужно один раз добавить
      # в Settings → Deploy keys.
      - name: Ensure deploy key on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            if [ ! -f ~/.ssh/gh_flatnik ]; then
              ssh-keygen -t ed25519 -N "" -C "flatnik-deploy" -f ~/.ssh/gh_flatnik
            fi
            ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
            echo "----- DEPLOY PUBLIC KEY -----"
            cat ~/.ssh/gh_flatnik.pub
            echo "-----------------------------"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_DIR,GH_HOST,REPO_PATH,SHA
          command_timeout: 30m
          script: |
            set -e
            REPO_SSH="git@${GH_HOST}:${REPO_PATH}"
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/gh_flatnik -o IdentitiesOnly=yes"

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone "$REPO_SSH" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$REPO_SSH"
            git fetch --all
            git reset --hard "$SHA"

            # На сервере ~1.9 ГБ RAM и общий диск — чистим перед сборкой,
            # иначе слои и висячие образы быстро съедают место.
            docker compose down --remove-orphans || true
            docker builder prune -af
            docker image prune -af

            echo "=== Свободно перед сборкой ==="
            free -m | head -2
            df -h / | tail -1

            docker compose up -d --build

            docker builder prune -af
            docker image prune -f

      - name: Health check and public URL
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR
          script: |
            cd "$APP_DIR"
            sleep 25
            echo "=== Контейнеры ==="
            docker compose ps
            echo "=== /api/health ==="
            curl -fsS http://localhost:8080/api/health || echo "health не отвечает"
            echo "=== Публичный URL ==="
            docker compose logs cloudflared 2>&1 \
              | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
              | tail -1 || echo "URL пока не выдан"
