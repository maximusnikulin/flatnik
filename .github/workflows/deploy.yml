name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /srv/flatnik
  GH_HOST: github.com
  REPO_PATH: maximusnikulin/flatnik.git

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      # Идемпотентно: ключ и known_hosts уже есть, шаг нужен при
      # пересоздании сервера. Если ключ создался заново — его публичную
      # часть надо добавить в Settings → Deploy keys (см. README).
      - name: Ensure deploy key on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            if [ ! -f ~/.ssh/gh_flatnik ]; then
              ssh-keygen -t ed25519 -N "" -C "flatnik-deploy" -f ~/.ssh/gh_flatnik
              echo "----- НОВЫЙ DEPLOY KEY, добавить в Settings → Deploy keys -----"
              cat ~/.ssh/gh_flatnik.pub
            fi
            ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_DIR,GH_HOST,REPO_PATH,SHA
          command_timeout: 30m
          script: |
            set -e
            REPO_SSH="git@${GH_HOST}:${REPO_PATH}"
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/gh_flatnik -o IdentitiesOnly=yes"

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone "$REPO_SSH" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$REPO_SSH"
            git fetch --all
            git reset --hard "$SHA"

            # Боевые секреты лежат в $APP_DIR/.env, которого нет в репозитории
            # (создаётся руками, см. README). Без этой проверки его пропажа не
            # была бы ошибкой: у всех переменных в docker-compose.prod.yml есть
            # dev-дефолты, поэтому стек поднялся бы зелёным и прошёл health, но
            # работал бы с JWT_SECRET=flatnik-dev-secret и паролем БД flatnik.
            # Проверяем до $COMPOSE down — иначе остановленный деплой оставил бы
            # сайт лежать.
            if [ ! -f .env ]; then
              echo "Нет $APP_DIR/.env — создайте его по образцу .env.example"
              exit 1
            fi

            env_value() { sed -n "s/^$1=//p" .env | tail -1; }

            for name in JWT_SECRET POSTGRES_PASSWORD; do
              if [ -z "$(env_value "$name")" ]; then
                echo "$name не задан в $APP_DIR/.env — деплой остановлен"
                exit 1
              fi
            done

            if [ "$(env_value JWT_SECRET)" = "flatnik-dev-secret" ] \
               || [ "$(env_value POSTGRES_PASSWORD)" = "flatnik" ]; then
              echo "В $APP_DIR/.env остались dev-значения секретов — деплой остановлен"
              exit 1
            fi

            # Не фатально: сервис поднимется, просто без карт или без капчи.
            for name in VITE_YANDEX_MAPS_API_KEY VITE_SMARTCAPTCHA_CLIENT_KEY SMARTCAPTCHA_SERVER_KEY; do
              [ -n "$(env_value "$name")" ] || echo "ВНИМАНИЕ: $name пуст в .env"
            done

            # Явный -f обязателен: файл по умолчанию (docker-compose.yml) — это
            # dev-стек, и голый docker compose up поднял бы его в production.
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # На сервере ~2 ГБ RAM и общий диск — чистим перед сборкой,
            # иначе слои и висячие образы быстро съедают место.
            $COMPOSE down --remove-orphans || true
            docker builder prune -af
            docker image prune -af

            # При падении healthcheck compose пишет только "is unhealthy",
            # поэтому логи контейнеров достаём сами.
            $COMPOSE up -d --build || {
              echo "=== logs back ==="
              $COMPOSE logs --tail=120 back
              echo "=== inspect back ==="
              docker inspect --format '{{json .State.Health}}' flatnik-back-1 || true
              exit 1
            }

            docker builder prune -af
            docker image prune -f

      - name: Health check and public URL
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR
          script: |
            cd "$APP_DIR"
            sleep 25
            echo "=== Контейнеры ==="
            docker compose -f docker-compose.prod.yml ps
            echo "=== /api/health ==="
            curl -fsS http://localhost:8080/api/health || echo "health не отвечает"
            echo "=== Публичный URL ==="
            docker compose -f docker-compose.prod.yml logs cloudflared 2>&1 \
              | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
              | tail -1 || echo "URL пока не выдан"
